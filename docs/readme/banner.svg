<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE3F1"/><stop offset="0.55" stop-color="#FFC2DF"/><stop offset="1" stop-color="#F7A8D8"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D6246E"/><stop offset="1" stop-color="#B03FB8"/></linearGradient>
<path id="h" d="M0 -6 C-6 -16 -22 -12 -20 0 C-18 10 0 20 0 20 C0 20 18 10 20 0 C22 -12 6 -16 0 -6 Z"/>
<path id="s" d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"/>
<style>.tw{animation:tw 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.d1{animation-delay:-.9s}.d2{animation-delay:-1.7s}
.bob{animation:bob 3.4s ease-in-out infinite}.b2{animation-delay:-1.7s}
@keyframes tw{0%,100%{transform:scale(.5);opacity:.35}50%{transform:scale(1.1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}</style>
</defs>
<rect width="1200" height="300" rx="28" fill="url(#bg)"/>
<g fill="#FFFFFF" opacity=".5"><circle cx="90" cy="60" r="5"/><circle cx="230" cy="250" r="4"/><circle cx="980" cy="50" r="4"/><circle cx="1120" cy="240" r="5"/><circle cx="620" cy="270" r="3"/></g>
<g class="bob"><use href="#h" x="140" y="150" fill="#FF5FA2" transform="translate(140 150) scale(1.6) translate(-140 -150)"/></g>
<g class="bob b2"><use href="#h" x="1060" y="140" fill="#FF8DC0" transform="translate(1060 140) scale(1.3) translate(-1060 -140)"/></g>
<use href="#h" x="250" y="80" fill="#FFB3D1"/><use href="#h" x="960" y="235" fill="#FFB3D1"/>
<use href="#s" class="tw" x="320" y="70" fill="#FFFFFF"/><use href="#s" class="tw d1" x="880" y="80" fill="#FFFFFF"/>
<use href="#s" class="tw d2" x="110" y="240" fill="#FFFFFF"/><use href="#s" class="tw d1" x="1110" y="70" fill="#FFFFFF"/><use href="#s" class="tw" x="760" y="255" fill="#FFFFFF"/>
<text x="600" y="135" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" fill="url(#t)">Sofia Stetsiuk · Portfolio</text>
<text x="600" y="185" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#7A2E63">QA Engineer × Game Designer</text>
<rect x="324.0" y="208" width="552.0" height="40" rx="20" fill="#FFFFFF" fill-opacity=".75"/>
